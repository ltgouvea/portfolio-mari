<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.08">
  <!-- Central Dot -->
  <circle cx="50" cy="50" r="1.2" fill="currentColor"/>
  
  <!-- Layer 1: Curvy Petals -->
  <g transform="translate(50,50)">
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(0)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(45)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(90)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(135)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(180)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(225)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(270)"/>
    <path d="M0,0 Q6,-12 0,-18 Q-6,-12 0,0" transform="rotate(315)"/>
  </g>

  <!-- Layer 2: Pontillist Ring (Dots) -->
  <g transform="translate(50,50)">
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(0)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(22.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(45)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(67.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(90)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(112.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(135)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(157.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(180)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(202.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(225)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(247.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(270)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(292.5)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(315)"/>
    <circle cx="0" cy="-22" r="0.6" fill="currentColor" transform="rotate(337.5)"/>
  </g>

  <!-- Layer 3: Outer Wispy Curves -->
  <g transform="translate(50,50)">
    <path d="M0,-25 C12,-30 12,-45 0,-50 C-12,-45 -12,-30 0,-25" transform="rotate(0)"/>
    <path d="M0,-25 C12,-30 12,-45 0,-50 C-12,-45 -12,-30 0,-25" transform="rotate(60)"/>
    <path d="M0,-25 C12,-30 12,-45 0,-50 C-12,-45 -12,-30 0,-25" transform="rotate(120)"/>
    <path d="M0,-25 C12,-30 12,-45 0,-50 C-12,-45 -12,-30 0,-25" transform="rotate(180)"/>
    <path d="M0,-25 C12,-30 12,-45 0,-50 C-12,-45 -12,-30 0,-25" transform="rotate(240)"/>
    <path d="M0,-25 C12,-30 12,-45 0,-50 C-12,-45 -12,-30 0,-25" transform="rotate(300)"/>
  </g>

  <!-- Layer 4: Fine Outer Dots -->
  <g transform="translate(50,50)">
    <circle cx="0" cy="-42" r="0.4" fill="currentColor" transform="rotate(30)"/>
    <circle cx="0" cy="-42" r="0.4" fill="currentColor" transform="rotate(90)"/>
    <circle cx="0" cy="-42" r="0.4" fill="currentColor" transform="rotate(150)"/>
    <circle cx="0" cy="-42" r="0.4" fill="currentColor" transform="rotate(210)"/>
    <circle cx="0" cy="-42" r="0.4" fill="currentColor" transform="rotate(270)"/>
    <circle cx="0" cy="-42" r="0.4" fill="currentColor" transform="rotate(330)"/>
  </g>
</svg>
