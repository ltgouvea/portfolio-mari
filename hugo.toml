baseURL = "https://maripsi.netlify.app/"
languageCode = "pt-br"
theme = "stack"
title = "Mariana F. de Oliveira"
copyright = "ltgouvea"
DefaultContentLanguage = "pt"
hasCJKLanguage = false

[pagination]
pagerSize = 5

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[params]
mainSections = ["post"]
featuredImageField = "image"
rssFullContent = true
favicon = "/favicon.ico"

  [params.footer]
  since = 2024
  customText = "Built with Hugo and the Stack theme."

  [params.dateFormat]
  published = "Jan 02, 2006"
  lastUpdated = "Jan 02, 2006 15:04 MST"

  [params.sidebar]
  emoji = "🧠"
  subtitle = "Psicóloga Clínica | Terapia Cognitivo-Comportamental"
    [params.sidebar.avatar]
    enabled = true
    local = true
    src = "img/avatar.png"

  [params.article]
  math = false
  toc = true
  readingTime = false
    [params.article.license]
    enabled = true
    default = "Licensed under CC BY-NC-SA 4.0"

  [params.comments]
  enabled = false # Disabled by default
  provider = "disqus" # Needs to be configured

  [params.widgets]
    [[params.widgets.page]]
    type = "toc"

  [params.opengraph.twitter]
  card = "summary_large_image"

  [params.defaultImage.opengraph]
  enabled = false
  local = false
  src = ""

  [params.colorScheme]
  toggle = false
  default = "light"

  [[menu.social]]
  identifier = "instagram"
  name = "Instagram"
  url = "https://www.instagram.com/mari.psicologa/"
  weight = 1
    [menu.social.params]
    icon = "instagram"

  [[menu.social]]
  identifier = "whatsapp"
  name = "WhatsApp"
  url = "https://wa.me/5511999999999"
  weight = 2
    [menu.social.params]
    icon = "whatsapp"

  [[menu.social]]
  identifier = "email"
  name = "Email"
  url = "mailto:email@example.com"
  weight = 3
    [menu.social.params]
    icon = "mail"

[markup]
  [markup.goldmark.renderer]
  unsafe = true
  [markup.tableOfContents]
  endLevel = 4
  ordered = false
  startLevel = 2
  [markup.highlight]
  noClasses = false